<style>
/* Layout: sticky study bar + single reading column; main page is a chapter grid with a 3-step method strip */

:root[data-theme="dark"]{

*{box-sizing:border-box}

.dic{width:100%;border-collapse:collapse}

<div id="app"></div>
<script>
const LVN={"A1": "입문 A1", "A2": "초급 A2"};
const CH=[{"id": 4, "lv": "A1", "es": "Describir personas", "ko": "사람 묘사하기: 외모·성격·감정", "desc": "ser·estar·tener·llevar의 역할을 구분하고, 외모·머리카락·성격·감정 어휘로 사람을 묘사합니다.", "vids": [["l-TFbsu0eAA", "Ser, estar, tener y llevar para describir personas", ""], ["IYSSFwqX32E", "Vocabulario descripción física", ""], ["b_t5a6T0xcI", "Describir el carácter", ""], ["867xuoU2ZRM", "Emociones y estados de ánimo", ""], ["zpdH2DfHTUw", "¿Papá Noel tiene barba o lleva barba?", "Shorts"]], "theory": "<p class=\"tip\">🔊 스페인어 표현을 누르면 발음을 들을 수 있어요.</p><h2>핵심 정리</h2>\n<h3>1. 사람 묘사에 쓰는 동사 4개</h3><div class=\"tw\"><table><thead><tr><th>동사</th><th>쓰임</th><th>예문</th></tr></thead><tbody><tr><td><b>ser</b></td><td>본질·영구적 특징, 외모, 성격, 직업, 국적</td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Mi hermano es alto, delgado y guapo\">Mi hermano es alto, delgado y guapo</span></td></tr><tr><td><b>estar</b></td><td>일시적 상태, 기분, 자세, 위치</td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Está contento\">Está contento</span> · <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Está sentada\">Está sentada</span></td></tr><tr><td><b>tener</b></td><td>소유, 신체 부위, 나이, 신체 감각</td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tiene la nariz grande\">Tiene la nariz grande</span> · <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tiene 20 años\">Tiene 20 años</span> · <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tiene sueño\">Tiene sueño</span></td></tr><tr><td><b>llevar</b></td><td>입고 걸친 것(옷·액세서리)</td><td><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Lleva un pantalón y una camisa\">Lleva un pantalón y una camisa</span></td></tr></tbody></table></div><ul class=\"rules\"><li>머리카락·수염처럼 바뀔 수 있는 부분은 <b>본질적·지속적</b>이면 tener, <b>인위적·일시적</b>이면 llevar: <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tiene barba\">Tiene barba</span> / <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Lleva el pelo rosa\">Lleva el pelo rosa</span>.</li><li>결혼 상태는 스페인은 estar, 중남미는 ser.</li></ul>\n<h3>2. 외모 어휘</h3><div class=\"chips\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"alto / alta\">alto / alta</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"bajo / baja\">bajo / baja</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"gordo / gorda\">gordo / gorda</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"delgado / delgada\">delgado / delgada</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"guapo / guapa\">guapo / guapa</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"feo / fea\">feo / fea</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"joven\">joven</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"mayor\">mayor</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"viejo / vieja\">viejo / vieja</span></div>\n<p><b>머리카락</b>: ser rubio·castaño·moreno·pelirrojo, 또는 <b>tener el pelo</b> + 색/모양 → <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tiene el pelo gris\">Tiene el pelo gris</span> · <span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"Tiene el pelo largo, liso y rizado\">Tiene el pelo largo, liso y rizado</span></p><div class=\"chips\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"largo\">largo</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"corto\">corto</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"liso\">liso</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"rizado\">rizado</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"calvo / calva\">calvo / calva</span></div><div class=\"note warn\"><b class=\"lab\">ATENCIÓN</b>색은 <b>rubio, castaño</b>를 쓰고 amarillo, marrón은 쓰지 않아요. 부정적인 형용사는 <b>un poco</b>로 부드럽게: Es un poco feo. <b>barba, bigote, gafas</b>는 관사 없이 씁니다: Tiene gafas.</div>\n<h3>3. 성격 (ser + 형용사)</h3><div class=\"tw\"><table><thead><tr><th>긍정</th><th>반대</th></tr></thead><tbody><tr><td>simpático 호감 가는</td><td>antipático 비호감인</td></tr><tr><td>alegre 명랑한</td><td>serio 진지한</td></tr><tr><td>sociable 사교적인</td><td>tímido 수줍은</td></tr><tr><td>abierto 개방적인</td><td>reservado 내성적인</td></tr><tr><td>hablador 말 많은</td><td>callado 말 없는</td></tr><tr><td>trabajador 부지런한</td><td>vago 게으른</td></tr><tr><td>tranquilo 차분한</td><td>nervioso 초조한</td></tr><tr><td>sincero 솔직한</td><td>mentiroso 거짓말쟁이</td></tr><tr><td>generoso 너그러운</td><td>egoísta 이기적인</td></tr><tr><td>cariñoso 다정한 · amable 친절한 · agradable 편안한 · inteligente 똑똑한</td><td></td></tr></tbody></table></div>\n<h3>4. 감정 (estar + 형용사)</h3><div class=\"chips\"><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"contento\">contento</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"feliz\">feliz</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"triste\">triste</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"deprimido\">deprimido</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"tranquilo\">tranquilo</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"relajado\">relajado</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"nervioso\">nervioso</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"preocupado\">preocupado</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"cansado\">cansado</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"agotado\">agotado</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"estresado\">estresado</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"enfadado\">enfadado</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"asustado\">asustado</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"sorprendido\">sorprendido</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"aburrido\">aburrido</span><span class=\"es\" role=\"button\" tabindex=\"0\" data-say=\"enamorado\">enamorado</span></div><p>또 다른 표현: <b>estar de buen / mal humor</b>, <b>tener miedo</b>, <b>tener vergüenza</b>. 남성은 -o, 여성은 -a (feliz, relajado처럼 남녀 같은 것도 있어요).</p>", "ex": [{"title": "연습 1. 알맞은 동사 고르기", "instr": "ser, estar, tener, llevar 중 알맞은 것을 고르세요.", "rule": "본질=ser / 상태=estar / 소유·나이·감각=tener / 입은 것=llevar.", "items": [{"t": "pick", "q": "Mi hermano ___ alto y delgado.", "o": ["es", "está", "tiene", "lleva"], "a": "es", "why": "외모는 ser."}, {"t": "pick", "q": "Ella ___ el pelo largo.", "o": ["es", "está", "tiene", "lleva"], "a": "tiene", "why": "신체 부위·머리는 tener."}, {"t": "pick", "q": "Hoy María ___ muy cansada.", "o": ["es", "está", "tiene", "lleva"], "a": "está", "why": "일시적 상태는 estar."}, {"t": "pick", "q": "Él ___ una camisa blanca.", "o": ["es", "está", "tiene", "lleva"], "a": "lleva", "why": "입은 옷은 llevar."}, {"t": "pick", "q": "Mi madre ___ 50 años.", "o": ["es", "está", "tiene", "lleva"], "a": "tiene", "why": "나이는 tener."}, {"t": "pick", "q": "Elena ___ simpática.", "o": ["es", "está", "tiene", "lleva"], "a": "es", "why": "성격은 ser."}, {"t": "pick", "q": "Los niños ___ sueño.", "o": ["están", "tienen", "son"], "a": "tienen", "why": "졸린 감각은 tener sueño."}, {"t": "pick", "q": "Pablo ___ de mal humor.", "o": ["está", "es", "tiene"], "a": "está", "why": "기분은 estar de mal humor."}]}, {"title": "연습 2. 어휘 고르기", "instr": "상황에 맞는 단어를 고르세요.", "rule": "성격은 ser, 감정은 estar. 형용사의 성·수를 맞추세요.", "items": [{"t": "pick", "q": "내 이웃(여성)은 말이 많아요. Es ___.", "o": ["habladora", "callada", "seria"], "a": "habladora", "why": "hablador/a = 말이 많은."}, {"t": "pick", "q": "할아버지는 곱슬머리예요. Tiene el pelo ___.", "o": ["liso", "rizado", "calvo"], "a": "rizado", "why": "rizado = 곱슬."}, {"t": "pick", "q": "Pedro는 항상 진실을 말해요. Es ___.", "o": ["sincero", "mentiroso", "vago"], "a": "sincero", "why": "sincero = 솔직한."}, {"t": "pick", "q": "많이 일한 뒤에 (남성): Estoy ___.", "o": ["cansado", "contento", "enamorado"], "a": "cansado", "why": "ca const NOBREAK='(?<!\\bSra?)(?<!\\bDra?)(?<!\\bSrta)(?<!\\bUds?)(?<!\\bEE)';
function fmtQ(s){
  if(!s) return s;
  s=s.replace(/ (?=–)/g,'<br>');
  s=s.replace(new RegExp('(?<![A-Za-z]\\.[A-Z])'+NOBREAK+'([.!?…])\\s+(?=[¿¡A-ZÁÉÍÓÚÑ(\\[])','g'),'$1<br>');
  return s;
}
function fmtTheory(h){
  const ES='<span class="es"';
  h=h.replace(/<\/span>(?:\s*[·\/]\s*|\s+)(?=<span class=\"es\")/g,'</span><br>');
  h=h.replace(/(<span class="es"[^>]*>)([^<]*)(<\/span>)/g,(m,a,t,c)=>a+fmtQ(t)+c);
  h=h.replace(/(<br>)\s*(<br>)/g,'$1');
  h=h.replace(/(:\s*)(<span class="es"[^>]*>[^<]*<\/span><br><span class="es")/g,'$1<br>$2');
  return h;
}
function exHTML(n,e,ei){

      return `<li class="item" id="i-${k}"><span class="n">${ii+1}</span><div class="q">${body}</div><div class="fb" id="fb-${k}"></div></li>`;
    }).join('')}</ol></section>`;

const strip = s => s.replace(/ñ/g,'\u0001').normalize('NFD').replace(/[̀-ͯ]/g,'');
const norm = s => s.toLowerCase().trim().replace(/\s+/g,' ').replace(/[.!?]+$/,'');
function judge(it,v){
  if(v===undefined||v==='') return 'none';
  if(it.t==='pick') return v===it.a?'ok':'bad';
  const x=norm(v);
  if(it.a.some(a=>norm(a)===x)) return 'ok';
  if(it.a.some(a=>strip(norm(a))===strip(x))) return 'half';
  return 'bad';
}
function showMark(n,ei,ii){
  const k=`${ei}-${ii}`, it=CH[0].ex[ei].items[ii], m=marks[n][k], li=document.getElementById('i-'+k), fb=document.getElementById('fb-'+k);
  li.classList.remove('ok','bad','half'); if(!m) return; li.classList.add(m);
  const ans = it.t==='pick'?it.a:it.a[0]; const rule = CH[0].ex[ei].rule;
  const why = it.why||rule;
  const head = m==='ok'?'✔ 정답':m==='half'?`△ 악센트(´) 확인 · 정답 <b>${ans}</b> (0.5점)`:`✘ 오답 · 정답 <b>${ans}</b>`;
  fb.innerHTML = head + (why?`<span class="why"><b>해설</b> ${why}</span>`:'');
}
function grade(n){
  const c=CH[0]; const res={ex:[],score:0,total:0,blank:0};
  c.ex.forEach((e,ei)=>{
    let s=0;
    e.items.forEach((it,ii)=>{
      const k=`${ei}-${ii}`, j=judge(it,state[n][k]);
      if(j==='none'){ marks[n][k]='bad'; res.blank++; } else marks[n][k]=j;
      if(j==='ok') s+=1; else if(j==='half') s+=.5;
      showMark(n,ei,ii);
      if(j==='none'){ document.getElementById('fb-'+k).innerHTML='✘ 미응답 · 정답 <b>'+(it.t==='pick'?it.a:it.a[0])+'</b>'+`<span class="why"><b>해설</b> ${it.why||e.rule}</span>`; }
    });
    document.getElementById('sc'+ei).textContent=`${fmt(s)} / ${e.items.length}`;
    res.ex.push({title:e.title,s,t:e.items.length}); res.score+=s; res.total+=e.items.length;
  });
  lastResult[n]=res;
  const pr=progress(); const old=pr['ch'+n];
  if(!old||res.score>=old.score){ pr['ch'+n]={score:res.score,total:res.total}; store.set('tee-progress',pr); }

    <div class="r-txt"><div class="eyebrow">${name?name+' · ':''}TEMA ${n} 결과</div><h2>${fmt(res.score)} / ${res.total}점 · ${msg[0]}</h2><p>${msg[1]}</p>${res.blank?`<p>풀지 않은 문제가 ${res.blank}개 있어요. 오답으로 처리되었습니다.</p>`:''}</div>
   </div>
   <div class="brk">${res.ex.map(e=>`<div><span>${e.title}</span><span class="bar"><i style="width:${e.s/e.t*100}%"></i></span><span>${fmt(e.s)}/${e.t}</span></div>`).join('')}</div>
   <div class="r-act"><button class="btn" id="retryWrong">틀린 문제만 다시 풀기</button><button class="btn ghost" id="retryAll">처음부터 다시 풀기</button></div>`;
  $('#retryWrong').onclick=()=>retry(n,false); $('#retryAll').onclick=()=>retry(n,true);
  if(scroll) el.scrollIntoView({behavior:'smooth',block:'center'});
}
function retry(n,all){
  const c=CH[0];
  c.ex.forEach((e,ei)=>e.items.forEach((it,ii)=>{
    const k=`${ei}-${ii}`, m=marks[n][k];
    if(all || m!=='ok'){
      delete state[n][k]; clearMark(n,k); const li=document.getElementById('i-'+k);
      if(it.t==='text') li.querySelector('input').value=''; else { li.querySelector('.blank').textContent=''; li.querySelectorAll('.opts button').forEach(b=>b.setAttribute('aria-checked','false')); }
    }
  }));
  c.ex.forEach((e,ei)=>{ $('#sc'+ei).textContent=''; });
  delete lastResult[n]; $('#result').hidden=true; updateCount(n);
  const first=document.querySelector('li.item:not(.ok)'); if(first) first.scrollIntoView({behavior:'smooth',block:'center'}); else window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- router ---------- */
function route(){
  chapter(SINGLE);
  window.scrollTo(0,0);
}
route();
